<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#062723">
<title>$FLUFF Whitelist | ElyFluff</title>
<meta name="description" content="Join the ElyFluff whitelist. 3,000 NFTs and the $FLUFF token. Free mint on Elysium mainnet.">
<meta property="og:title" content="$FLUFF Whitelist | ElyFluff">
<meta property="og:description" content="Join the ElyFluff whitelist. Free mint on Elysium mainnet.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="fluff-token.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo+Black&family=Rubik+Mono+One&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>

<div class="rays" aria-hidden="true"></div>

<div class="term" id="term">
  <div class="bar">
    <span class="dots" aria-hidden="true"><i class="d1"></i><i></i><i></i></span>
    <span class="bar-title">elyfluff@whitelist: ~</span>
    <span class="bar-right">
      <a class="bar-ai" href="checker">winners</a>
      <button class="bar-ai" type="button" data-open-agent>ask ai</button>
      <a class="bar-x" href="#" data-x-profile target="_blank" rel="noopener noreferrer"><span data-cfg="X_HANDLE_AT">@ElyFluff</span></a>
    </span>
  </div>

  <div class="screen" id="screen">
    <header class="head">
      <canvas class="avatar" id="avatar" width="192" height="192" aria-hidden="true"></canvas>
      <div class="head-txt">
        <h1 class="title">ElyFluff</h1>
        <p class="sub">whitelist terminal · free mint on elysium mainnet</p>
      </div>
    </header>
    <hr class="rule">

    <div id="out" aria-live="polite"></div>
    <div id="prompt"></div>
  </div>
</div>

<!-- AI AGENT -->
<button class="fab" id="agentFab" type="button" data-open-agent aria-label="Ask ElyFluff AI">ask ai<span class="caret"></span></button>

<div class="agent" id="agent" role="dialog" aria-labelledby="agentTitle" hidden>
  <div class="bar small">
    <span class="dots" aria-hidden="true"><i class="d1"></i><i></i><i></i></span>
    <span class="bar-title" id="agentTitle">elyfluff@ai: ~</span>
    <button class="ag-x" id="agentClose" type="button" aria-label="Close">close ×</button>
  </div>
  <div class="ag-msgs" id="agentMsgs" aria-live="polite"></div>
  <div class="ag-chips" id="agentChips"></div>
  <form class="ag-form" id="agentForm" autocomplete="off">
    <label class="ag-ps" for="agentIn">you@elyfluff:~$</label>
    <input id="agentIn" type="text" maxlength="300" placeholder="ask anything..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn btn-sm" type="submit">send ↵</button>
  </form>
</div>

<script src="config.js?v=12"></script>
<script src="chain.js?v=12"></script>
<script src="game.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
